<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aditya Number Info API — Developed by Adibhai</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #05080c; color: #c9f7d0;
    font-family: 'Courier New', monospace;
    min-height: 100vh; padding: 20px;
    overflow-x: hidden;
  }
  #matrix {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%; z-index: 0; opacity: 0.08;
  }
  .container {
    position: relative; z-index: 1;
    max-width: 800px; margin: 0 auto;
    padding: 40px 20px;
  }
  header { text-align: center; margin-bottom: 40px; }
  .logo {
    font-size: 38px; font-weight: bold; color: #7cf7a0;
    text-shadow: 0 0 20px #7cf7a0; letter-spacing: 3px;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%,100% { text-shadow: 0 0 20px #7cf7a0; }
    50% { text-shadow: 0 0 30px #7cf7a0, 0 0 40px #7cf7a0; }
  }
  .subtitle {
    color: #5a7c66; font-size: 12px; margin-top: 10px;
    letter-spacing: 4px; text-transform: uppercase;
  }
  .dev-badge {
    display: inline-block; margin-top: 15px;
    padding: 6px 16px; border: 1px solid #1f2a33;
    border-radius: 20px; font-size: 12px; color: #7cf7a0;
    background: #0d1218;
  }
  .card {
    background: #0d1218; border: 1px solid #1f2a33;
    border-radius: 12px; padding: 24px; margin-bottom: 20px;
  }
  .card h3 {
    color: #7cf7a0; font-size: 16px;
    margin-bottom: 14px; letter-spacing: 1px;
  }
  .endpoint {
    background: #05080c; padding: 12px 16px;
    border-radius: 8px; margin-bottom: 10px;
    border-left: 3px solid #7cf7a0;
    font-size: 13px; word-break: break-all;
  }
  .method {
    display: inline-block; padding: 2px 8px;
    background: #7cf7a0; color: #05080c;
    font-weight: bold; border-radius: 4px;
    font-size: 11px; margin-right: 8px;
  }
  .try {
    display: flex; gap: 10px; margin-top: 16px;
  }
  input {
    flex: 1; padding: 12px 16px;
    background: #05080c; border: 1px solid #1f2a33;
    border-radius: 8px; color: #c9f7d0;
    font-family: inherit; font-size: 15px;
  }
  input:focus {
    outline: none; border-color: #7cf7a0;
    box-shadow: 0 0 15px rgba(124,247,160,0.2);
  }
  button {
    padding: 12px 24px;
    background: #7cf7a0; color: #05080c;
    border: none; border-radius: 8px;
    font-family: inherit; font-weight: bold;
    font-size: 13px; cursor: pointer;
    letter-spacing: 1px; transition: all .2s;
  }
  button:hover { background: #a3ffbe; }
  pre {
    background: #000; padding: 16px;
    border-radius: 8px; overflow-x: auto;
    font-size: 12px; line-height: 1.6;
    color: #c9f7d0; margin-top: 16px;
    max-height: 400px;
  }
  .links {
    display: flex; gap: 12px; justify-content: center;
    margin-top: 30px; flex-wrap: wrap;
  }
  .links a {
    padding: 10px 20px; background: #131820;
    border: 1px solid #1f2a33; border-radius: 8px;
    color: #7cf7a0; text-decoration: none;
    font-size: 13px; transition: all .2s;
  }
  .links a:hover {
    border-color: #7cf7a0;
    box-shadow: 0 0 15px rgba(124,247,160,0.2);
  }
  footer {
    text-align: center; margin-top: 40px;
    padding-top: 24px; border-top: 1px solid #141a22;
    color: #3d5448; font-size: 12px; line-height: 1.8;
  }
  footer a { color: #7cf7a0; text-decoration: none; }
  @media (max-width: 600px) {
    .logo { font-size: 24px; }
    .try { flex-direction: column; }
  }
</style>
</head>
<body>
<canvas id="matrix"></canvas>

<div class="container">
  <header>
    <div class="logo">◉ ADITYA NUMBER API</div>
    <div class="subtitle">Number Info Platform</div>
    <div class="dev-badge">👑 Developed by Adibhai</div>
  </header>

  <div class="card">
    <h3>📡 Endpoints</h3>
    <div class="endpoint">
      <span class="method">GET</span> <code>/api/number?number=9876543210</code>
    </div>
    <div class="endpoint">
      <span class="method">GET</span> <code>/api/health</code>
    </div>
    <div class="endpoint">
      <span class="method">GET</span> <code>/api/info</code>
    </div>
  </div>

  <div class="card">
    <h3>🧪 Live Test</h3>
    <div class="try">
      <input type="text" id="num" placeholder="9876543210" maxlength="15">
      <button onclick="test()">TEST API</button>
    </div>
    <pre id="out">// result yahan aayega...</pre>
  </div>

  <div class="links">
    <a href="https://youtube.com/@geniushacker29" target="_blank">📺 YouTube</a>
    <a href="https://t.me/geniushackerfreetools" target="_blank">✈️ Telegram</a>
  </div>

  <footer>
    <div>© 2026 ADITYA NUMBER API</div>
    <div style="margin-top: 8px;">
      👑 Developed by Adibhai
    </div>
    <div style="margin-top: 8px;">
      📺 <a href="https://youtube.com/@geniushacker29" target="_blank">YouTube</a>
      &nbsp;·&nbsp;
      ✈️ <a href="https://t.me/geniushackerfreetools" target="_blank">Telegram</a>
    </div>
  </footer>
</div>

<script>
// matrix bg
const canvas = document.getElementById('matrix');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
const chars = '01アイウエオカキクケコ0123456789ABCDEF';
const fontSize = 14;
const drops = Array(Math.floor(canvas.width / fontSize)).fill(1);

function drawMatrix() {
  ctx.fillStyle = 'rgba(5,8,12,0.05)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#7cf7a0';
  ctx.font = fontSize + 'px monospace';
  for (let i = 0; i < drops.length; i++) {
    const text = chars[Math.floor(Math.random() * chars.length)];
    ctx.fillText(text, i * fontSize, drops[i] * fontSize);
    if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
    drops[i]++;
  }
}
setInterval(drawMatrix, 50);
window.addEventListener('resize', () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});

async function test() {
  const num = document.getElementById('num').value.replace(/[^0-9]/g, '');
  const out = document.getElementById('out');
  if (num.length < 10) {
    out.textContent = '// Enter 10-digit number';
    return;
  }
  out.textContent = '// Loading...';
  try {
    const r = await fetch('/api/number?number=' + num);
    const d = await r.json();
    out.textContent = JSON.stringify(d, null, 2);
  } catch (e) {
    out.textContent = '// Error: ' + e.message;
  }
}

document.getElementById('num').addEventListener('keypress', e => {
  if (e.key === 'Enter') test();
});
</script>
</body>
</html>
